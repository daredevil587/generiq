name = "generiq"
main = ".open-next/worker.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "generiq"
database_id = "YOUR-D1-DATABASE-ID"   # Replace after: wrangler d1 create generiq
