name: Price Scraper

on:
  schedule:
    # Runs every 48 hours — Mon/Wed/Fri/Sun at 06:00 UTC
    - cron: "0 6 * * 0,1,3,5"
  workflow_dispatch:          # allow manual trigger from GitHub UI
    inputs:
      limit:
        description: "Number of medicines to price per run"
        default: "200"
      pharmacy:
        description: "Comma-separated pharmacies (boots,superdrug,holland-barrett,pharmacy2u) or blank for all"
        default: ""

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          LIMIT="${{ github.event.inputs.limit || '200' }}"
          PHARMACY="${{ github.event.inputs.pharmacy || '' }}"

          CMD="npx tsx scripts/scraper/run.ts --limit $LIMIT"
          if [ -n "$PHARMACY" ]; then
            CMD="$CMD --pharmacy $PHARMACY"
          fi

          echo "Running: $CMD"
          eval $CMD

      - name: Sync PostgreSQL prices to production D1
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/scrapers/sync-pg-to-d1.mjs --remote

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-logs
          path: /tmp/scraper-*.log
          retention-days: 7
